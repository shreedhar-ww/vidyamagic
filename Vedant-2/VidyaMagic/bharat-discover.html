<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#FF6B35"/>
<link rel="manifest" href="manifest.json"/>
<link rel="stylesheet" href="css/themes.css"/>
<title>Bharat Discover — VidyaMagic</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Nunito',sans-serif;background:#FFF9F0;min-height:100vh;overflow-x:hidden;}

/* ── HERO ── */
.hero{background:linear-gradient(135deg,#FF6B35 0%,#FF6B9D 50%,#9B5DE5 100%);padding:0 0 32px;position:relative;overflow:hidden;}
.hero::after{content:'';position:absolute;bottom:-20px;left:0;right:0;height:40px;background:#FFF9F0;border-radius:50% 50% 0 0/100% 100% 0 0;}
.hero-inner{max-width:1200px;margin:0 auto;padding:0 24px;}
.hero-nav{display:flex;align-items:center;gap:12px;padding:14px 0 12px;position:relative;z-index:2;}
.back-btn{background:rgba(255,255,255,.25);border:none;border-radius:50%;width:42px;height:42px;font-size:1.3rem;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;transition:background .2s;}
.back-btn:hover{background:rgba(255,255,255,.4);}
.hero-title{color:#fff;font-size:1.5rem;font-weight:900;flex:1;text-shadow:1px 2px 0 rgba(0,0,0,.15);}
.stars-pill{background:rgba(255,255,255,.25);color:#fff;font-weight:900;padding:6px 16px;border-radius:20px;font-size:.95rem;}
.hero-body{display:flex;align-items:center;gap:16px;position:relative;z-index:2;padding-bottom:4px;}
.mascot-big{font-size:68px;animation:bob 2.2s ease-in-out infinite;flex-shrink:0;}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
.hero-speech{background:rgba(255,255,255,.22);backdrop-filter:blur(8px);border-radius:20px 20px 20px 4px;padding:12px 18px;color:#fff;font-size:.95rem;font-weight:700;line-height:1.5;max-width:380px;}

/* ── PROGRESS BAR ── */
.xp-bar-wrap{background:rgba(255,255,255,.2);border-radius:10px;height:10px;margin:10px 24px 0;overflow:hidden;position:relative;z-index:2;}
.xp-bar{height:100%;background:#FFD93D;border-radius:10px;transition:width .5s ease;}

/* ── TABS ── */
.tabs-wrap{position:sticky;top:0;z-index:99;background:#FFF9F0;padding:12px 0 6px;box-shadow:0 2px 12px rgba(0,0,0,.06);}
.tabs{display:flex;gap:8px;max-width:1200px;margin:0 auto;padding:0 24px;}
.tab{flex:0 0 auto;width:130px;padding:9px 6px;text-align:center;font-weight:900;font-size:.82rem;border-radius:14px;cursor:pointer;border:2.5px solid #ffe0cc;color:#aaa;background:#fff;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:2px;}
.tab-icon{font-size:1.3rem;}
.tab.active{background:linear-gradient(135deg,#FF6B35,#FF6B9D);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(255,107,53,.35);}

/* ── SCREENS ── */
.screen{display:none;padding:18px 24px 48px;max-width:1200px;margin:0 auto;}
.screen.active{display:block;}

/* ── STATE CARDS GRID ── */
.states-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;}

.state-card{
  border-radius:22px;padding:20px 16px;text-align:center;cursor:pointer;
  position:relative;overflow:hidden;
  box-shadow:0 6px 0 rgba(0,0,0,.1);
  transition:transform .2s,box-shadow .2s;
  color:#fff;
}
.state-card:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 12px 0 rgba(0,0,0,.08);}
.state-card:active{transform:translateY(0) scale(.97);}
.state-card.completed::after{
  content:'✅';position:absolute;top:10px;right:12px;font-size:1.2rem;
}
.state-emoji{font-size:48px;display:block;margin-bottom:8px;animation:wobble 3s ease-in-out infinite;}
@keyframes wobble{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.state-name{font-size:1.1rem;font-weight:900;text-shadow:1px 2px 0 rgba(0,0,0,.15);}
.state-capital-badge{
  display:inline-block;margin-top:8px;
  background:rgba(255,255,255,.3);
  padding:3px 12px;border-radius:12px;font-size:.75rem;font-weight:700;
}

/* State card colors */
.sc1{background:linear-gradient(135deg,#FF6B35,#FFD93D);}
.sc2{background:linear-gradient(135deg,#00BBF9,#9B5DE5);}
.sc3{background:linear-gradient(135deg,#F15BB5,#FF6B35);}
.sc4{background:linear-gradient(135deg,#00F5D4,#00BBF9);}
.sc5{background:linear-gradient(135deg,#9B5DE5,#F15BB5);}
.sc6{background:linear-gradient(135deg,#FFD93D,#00F5D4);}
.sc7{background:linear-gradient(135deg,#FF6B35,#F15BB5);}
.sc8{background:linear-gradient(135deg,#00BBF9,#00F5D4);}

/* ── STATE DETAIL MODAL ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;justify-content:center;align-items:flex-start;padding:20px;overflow-y:auto;}
.overlay.show{display:flex;}
.modal{background:#fff;border-radius:28px;max-width:560px;width:100%;margin:auto;animation:popIn .35s cubic-bezier(.34,1.56,.64,1);overflow:hidden;}
@keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

.modal-hero{padding:28px 24px 20px;text-align:center;position:relative;}
.modal-close{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.3);border:none;border-radius:50%;width:34px;height:34px;font-size:1rem;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;}
.modal-state-emoji{font-size:64px;display:block;margin-bottom:6px;}
.modal-state-name{font-size:1.8rem;font-weight:900;color:#fff;text-shadow:1px 2px 0 rgba(0,0,0,.15);}

.modal-body{padding:20px 24px;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;}
.info-card{background:#FFF9F0;border-radius:16px;padding:14px;text-align:center;}
.info-icon{font-size:28px;display:block;margin-bottom:4px;}
.info-label{font-size:.7rem;font-weight:900;color:#aaa;text-transform:uppercase;letter-spacing:.5px;}
.info-value{font-size:.95rem;font-weight:900;color:#333;margin-top:2px;}

/* Story card */
.story-card{
  background:linear-gradient(135deg,#fff5e0,#ffe8f5);
  border-radius:18px;padding:18px;margin-bottom:16px;
  border-left:5px solid #FF6B35;
}
.story-title{font-size:.85rem;font-weight:900;color:#FF6B35;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.story-text{font-size:.95rem;font-weight:700;color:#555;line-height:1.7;}

/* Fun fact */
.fun-fact{
  background:linear-gradient(135deg,#e8f5ff,#f0e8ff);
  border-radius:18px;padding:14px 18px;margin-bottom:16px;
  display:flex;align-items:flex-start;gap:12px;
}
.fun-fact-icon{font-size:28px;flex-shrink:0;}
.fun-fact-text{font-size:.9rem;font-weight:700;color:#555;line-height:1.6;}

/* Quick Quiz */
.quick-quiz{margin-top:4px;}
.quick-quiz h4{font-size:1rem;font-weight:900;color:#333;margin-bottom:12px;}
.qq-option{
  width:100%;padding:12px 18px;margin-bottom:8px;text-align:left;
  border:2.5px solid #eee;border-radius:14px;font-size:.95rem;font-weight:700;
  cursor:pointer;background:#fff;font-family:'Nunito',sans-serif;
  transition:all .2s;color:#333;
}
.qq-option:hover{border-color:#FF6B35;background:#fff5f0;}
.qq-option.correct{background:linear-gradient(135deg,#00F5D4,#00BBF9);border-color:#00F5D4;color:#111;}
.qq-option.wrong{background:#ffe0e0;border-color:#ff8a8a;color:#c00;}
.qq-fb{text-align:center;font-size:1rem;font-weight:900;min-height:28px;margin:8px 0;}
.qq-fb.ok{color:#00b894;} .qq-fb.no{color:#e17055;}

.modal-btns{display:flex;gap:10px;justify-content:center;padding:0 24px 20px;flex-wrap:wrap;}
.btn{padding:11px 22px;border:none;border-radius:50px;font-size:.95rem;font-weight:900;cursor:pointer;font-family:'Nunito',sans-serif;transition:transform .15s;box-shadow:0 4px 0 rgba(0,0,0,.12);}
.btn:hover{transform:translateY(-3px);}
.btn-primary{background:linear-gradient(135deg,#FF6B35,#FF6B9D);color:#fff;}
.btn-close{background:#eee;color:#555;}

/* ── STAMP BOOK ── */
.stamp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;}
.stamp{
  border-radius:18px;padding:16px 10px;text-align:center;
  border:3px dashed #ddd;background:#fafafa;
  transition:all .3s;
}
.stamp.earned{border-style:solid;border-color:#FFD93D;background:#fff9e0;box-shadow:0 4px 12px rgba(255,215,0,.3);}
.stamp-emoji{font-size:36px;display:block;margin-bottom:6px;filter:grayscale(1);transition:filter .3s;}
.stamp.earned .stamp-emoji{filter:none;}
.stamp-name{font-size:.75rem;font-weight:900;color:#aaa;}
.stamp.earned .stamp-name{color:#333;}

/* confetti */
.confetti-piece{position:fixed;width:10px;height:14px;border-radius:2px;animation:fall 1.2s ease-in forwards;z-index:999;pointer-events:none;}
@keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>

<!-- HERO -->
<div class="hero">
  <div class="hero-inner">
    <div class="hero-nav">
      <button class="back-btn" onclick="history.back()">←</button>
      <div class="hero-title">🇮🇳 Bharat Discover</div>
      <div class="stars-pill" id="topStars">⭐ 0</div>
    </div>
    <div class="hero-body">
      <span class="mascot-big" id="mascot">🦁</span>
      <div class="hero-speech">
        <strong>Namaste, Explorer!</strong><br>
        Let's travel across India — discover every state! 🗺️
      </div>
    </div>
  </div>
  <div class="xp-bar-wrap">
    <div class="xp-bar" id="xpBar" style="width:0%"></div>
  </div>
</div>

<!-- TABS -->
<div class="tabs-wrap">
  <div class="tabs">
    <div class="tab active" onclick="switchTab('explore',this)">
      <span class="tab-icon">🗺️</span>Explore
    </div>
    <div class="tab" onclick="switchTab('stamps',this)">
      <span class="tab-icon">📮</span>Stamp Book
    </div>
  </div>
</div>

<!-- EXPLORE TAB -->
<div id="explore" class="screen active">
  <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:18px;">
    <div>
      <div style="font-size:1.1rem;font-weight:900;color:#333;">🌏 Discover India</div>
      <div style="font-size:.8rem;color:#aaa;font-weight:700;" id="progressLabel">0 of 8 states explored</div>
    </div>
    <div id="completedBadge" style="display:none;background:linear-gradient(135deg,#FFD93D,#FF6B35);color:#fff;font-weight:900;padding:6px 16px;border-radius:14px;font-size:.85rem;">
      🏆 India Explorer!
    </div>
  </div>
  <div class="states-grid" id="statesGrid"></div>
</div>

<!-- STAMP BOOK TAB -->
<div id="stamps" class="screen">
  <div style="font-size:1.1rem;font-weight:900;color:#333;margin-bottom:6px;">📮 My Stamp Collection</div>
  <div style="font-size:.8rem;color:#aaa;font-weight:700;margin-bottom:18px;">Complete a state's quiz to earn its stamp!</div>
  <div class="stamp-grid" id="stampGrid"></div>
</div>

<!-- STATE DETAIL MODAL -->
<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-hero" id="modalHero">
      <button class="modal-close" onclick="closeModalBtn()">✕</button>
      <span class="modal-state-emoji" id="mEmoji"></span>
      <div class="modal-state-name" id="mName"></div>
    </div>
    <div class="modal-body">
      <div class="info-grid" id="mInfoGrid"></div>
      <div class="story-card">
        <div class="story-title">📖 Story Time</div>
        <div class="story-text" id="mStory"></div>
      </div>
      <div class="fun-fact" id="mFunFact"></div>
      <div class="quick-quiz" id="mQuiz"></div>
    </div>
    <div class="modal-btns">
      <button class="btn btn-primary" onclick="closeModalBtn()">✅ Got it!</button>
      <button class="btn btn-close" onclick="closeModalBtn()">✕ Close</button>
    </div>
  </div>
</div>

<script type="module">
import { ensureTheme, getTheme } from './js/theme.js';
import { load, save, addStars } from './js/progress.js';

const theme = ensureTheme();
if (theme) document.getElementById('mascot').textContent = theme.mascot;

let progress = load();
document.getElementById('topStars').textContent = '⭐ ' + (progress.totalStars || 0);

// ── STATE DATA ──
const STATES = [
  {
    id: 'maharashtra', name: 'Maharashtra', emoji: '🏙️', color: 'sc1',
    capital: 'Mumbai', food: 'Vada Pav 🥪', animal: 'Giant Squirrel 🐿️', festival: 'Ganesh Chaturthi 🐘',
    story: 'Rohan and his family visited Mumbai — the City of Dreams! They saw the famous Gateway of India standing tall near the sea. Rohan ate a delicious Vada Pav and watched the Bollywood stars drive by. Mumbai never sleeps!',
    funFact: '🌟 Maharashtra is home to Bollywood — the world\'s largest film industry!',
    quiz: { q: 'What is the capital of Maharashtra?', ans: 'Mumbai', opts: ['Pune', 'Mumbai', 'Nagpur', 'Nashik'] }
  },
  {
    id: 'kerala', name: 'Kerala', emoji: '🌴', color: 'sc2',
    capital: 'Thiruvananthapuram', food: 'Sadya 🍌', animal: 'Elephant 🐘', festival: 'Onam 🌸',
    story: 'Priya floated on a houseboat through the beautiful backwaters of Kerala. Green coconut trees lined both sides. She ate a grand Sadya meal served on a banana leaf — over 20 dishes! Kerala is truly God\'s Own Country.',
    funFact: '🌟 Kerala has 100% literacy — every single person can read and write!',
    quiz: { q: 'Which festival is celebrated in Kerala with boat races?', ans: 'Onam', opts: ['Diwali', 'Onam', 'Holi', 'Pongal'] }
  },
  {
    id: 'rajasthan', name: 'Rajasthan', emoji: '🏰', color: 'sc3',
    capital: 'Jaipur', food: 'Dal Baati 🫓', animal: 'Camel 🐪', festival: 'Pushkar Mela 🎪',
    story: 'Arjun rode a camel through the golden sand dunes of Rajasthan. He visited the magnificent Amber Fort in Jaipur — the Pink City! At night, he watched folk dancers perform under a sky full of stars. The desert was magical!',
    funFact: '🌟 Rajasthan is India\'s largest state by area — bigger than many countries!',
    quiz: { q: 'Rajasthan is known as the "Land of ___"?', ans: 'Kings', opts: ['Rivers', 'Kings', 'Elephants', 'Tigers'] }
  },
  {
    id: 'tamil_nadu', name: 'Tamil Nadu', emoji: '🛕', color: 'sc4',
    capital: 'Chennai', food: 'Idli Sambar 🍚', animal: 'Nilgiri Tahr 🐐', festival: 'Pongal 🌾',
    story: 'Deepa visited the ancient Meenakshi Temple in Madurai — it had 14 colorful towers covered in thousands of sculptures! She ate crispy dosas for breakfast and watched a Bharatanatyam dance performance. Tamil Nadu has a history of over 2000 years!',
    funFact: '🌟 Tamil is one of the oldest languages in the world — over 2000 years old!',
    quiz: { q: 'What is the harvest festival of Tamil Nadu?', ans: 'Pongal', opts: ['Onam', 'Bihu', 'Pongal', 'Ugadi'] }
  },
  {
    id: 'punjab', name: 'Punjab', emoji: '🌾', color: 'sc5',
    capital: 'Chandigarh', food: 'Makki di Roti 🫓', animal: 'Blackbuck 🦌', festival: 'Baisakhi 💃',
    story: 'Gurpreet danced the lively Bhangra at the Baisakhi festival! Golden wheat fields stretched as far as the eye could see. He visited the Golden Temple in Amritsar — its reflection shimmering in the holy lake was breathtaking. Punjab, the land of five rivers!',
    funFact: '🌟 Punjab is called the "Breadbasket of India" — it grows wheat for the whole country!',
    quiz: { q: 'What is the famous golden monument in Punjab?', ans: 'Golden Temple', opts: ['Taj Mahal', 'Golden Temple', 'Qutub Minar', 'Red Fort'] }
  },
  {
    id: 'west_bengal', name: 'West Bengal', emoji: '🐯', color: 'sc6',
    capital: 'Kolkata', food: 'Rasgulla 🍬', animal: 'Royal Bengal Tiger 🐯', festival: 'Durga Puja 🙏',
    story: 'Mitu celebrated Durga Puja in Kolkata — the city was alive with giant decorated pandals everywhere! She ate the sweetest Rasgulla and rode a yellow taxi through the bustling streets. Kolkata is the cultural capital of India!',
    funFact: '🌟 The Sundarbans in West Bengal is the world\'s largest mangrove forest and home to Royal Bengal Tigers!',
    quiz: { q: 'Which sweet is West Bengal famous for?', ans: 'Rasgulla', opts: ['Jalebi', 'Rasgulla', 'Ladoo', 'Barfi'] }
  },
  {
    id: 'gujarat', name: 'Gujarat', emoji: '🦁', color: 'sc7',
    capital: 'Gandhinagar', food: 'Dhokla 🫓', animal: 'Asiatic Lion 🦁', festival: 'Navratri 💃',
    story: 'Nila danced Garba for nine nights during Navratri — colourful lehenga spinning, clapping in rhythm! She visited the Gir Forest where the only Asiatic Lions in the world live. And she ate fluffy Dhokla for breakfast every day. Gujarat is vibrant!',
    funFact: '🌟 Mahatma Gandhi — the Father of the Nation — was born in Gujarat!',
    quiz: { q: 'Where in India can you find Asiatic Lions?', ans: 'Gir Forest, Gujarat', opts: ['Kaziranga', 'Gir Forest, Gujarat', 'Sundarbans', 'Corbett'] }
  },
  {
    id: 'assam', name: 'Assam', emoji: '🍵', color: 'sc8',
    capital: 'Dispur', food: 'Masor Tenga 🐟', animal: 'One-horned Rhino 🦏', festival: 'Bihu 🥁',
    story: 'Bimal walked through miles of green tea gardens in Assam — the tea that people drink all over the world comes from here! He spotted a one-horned rhinoceros in Kaziranga National Park. The Bihu dance was energetic and joyful!',
    funFact: '🌟 Assam produces more than 50% of India\'s total tea!',
    quiz: { q: 'Which animal is Assam famous for protecting?', ans: 'One-horned Rhino', opts: ['Tiger', 'Elephant', 'One-horned Rhino', 'Snow Leopard'] }
  }
];

// ── PROGRESS ──
function getGkProgress() {
  return progress.gk || (progress.gk = { completed: [], stars: 0 });
}

function isCompleted(stateId) {
  return getGkProgress().completed.includes(stateId);
}

function markCompleted(stateId) {
  const gk = getGkProgress();
  if (!gk.completed.includes(stateId)) {
    gk.completed.push(stateId);
    addStars(progress, 3);
    save(progress);
    document.getElementById('topStars').textContent = '⭐ ' + (progress.totalStars || 0);
  }
  updateProgressUI();
}

function updateProgressUI() {
  const done = getGkProgress().completed.length;
  const total = STATES.length;
  document.getElementById('progressLabel').textContent = `${done} of ${total} states explored`;
  document.getElementById('xpBar').style.width = (done / total * 100) + '%';
  if (done === total) document.getElementById('completedBadge').style.display = 'inline-block';
}

// ── RENDER STATES GRID ──
function renderStates() {
  const grid = document.getElementById('statesGrid');
  grid.innerHTML = '';
  STATES.forEach(s => {
    const done = isCompleted(s.id);
    const card = document.createElement('div');
    card.className = `state-card ${s.color}${done ? ' completed' : ''}`;
    card.innerHTML = `
      <span class="state-emoji">${s.emoji}</span>
      <div class="state-name">${s.name}</div>
      <div class="state-capital-badge">🏛️ ${s.capital}</div>
    `;
    card.onclick = () => openState(s);
    grid.appendChild(card);
  });
  updateProgressUI();
}

// ── RENDER STAMP BOOK ──
function renderStamps() {
  const grid = document.getElementById('stampGrid');
  grid.innerHTML = '';
  STATES.forEach(s => {
    const done = isCompleted(s.id);
    const stamp = document.createElement('div');
    stamp.className = `stamp${done ? ' earned' : ''}`;
    stamp.innerHTML = `
      <span class="stamp-emoji">${s.emoji}</span>
      <div class="stamp-name">${s.name}</div>
      ${done ? '<div style="font-size:.65rem;color:#FF6B35;font-weight:900;margin-top:4px;">✅ Collected!</div>' : ''}
    `;
    grid.appendChild(stamp);
  });
}

// ── OPEN STATE MODAL ──
let currentState = null, quizAnswered = false;

function openState(s) {
  currentState = s; quizAnswered = false;
  confettiBurst(15);

  // Hero
  const hero = document.getElementById('modalHero');
  hero.style.background = '';
  const colors = {
    sc1:'linear-gradient(135deg,#FF6B35,#FFD93D)', sc2:'linear-gradient(135deg,#00BBF9,#9B5DE5)',
    sc3:'linear-gradient(135deg,#F15BB5,#FF6B35)', sc4:'linear-gradient(135deg,#00F5D4,#00BBF9)',
    sc5:'linear-gradient(135deg,#9B5DE5,#F15BB5)', sc6:'linear-gradient(135deg,#FFD93D,#00F5D4)',
    sc7:'linear-gradient(135deg,#FF6B35,#F15BB5)', sc8:'linear-gradient(135deg,#00BBF9,#00F5D4)',
  };
  hero.style.background = colors[s.color] || 'linear-gradient(135deg,#FF6B35,#FF6B9D)';
  document.getElementById('mEmoji').textContent = s.emoji;
  document.getElementById('mName').textContent = s.name;

  // Info grid
  document.getElementById('mInfoGrid').innerHTML = `
    <div class="info-card"><span class="info-icon">🏛️</span><div class="info-label">Capital</div><div class="info-value">${s.capital}</div></div>
    <div class="info-card"><span class="info-icon">${s.food.split(' ')[1] || '🍽️'}</span><div class="info-label">Famous Food</div><div class="info-value">${s.food.split(' ')[0]}</div></div>
    <div class="info-card"><span class="info-icon">${s.animal.split(' ')[s.animal.split(' ').length-1]}</span><div class="info-label">State Animal</div><div class="info-value">${s.animal.split(' ').slice(0,-1).join(' ')}</div></div>
    <div class="info-card"><span class="info-icon">${s.festival.split(' ')[s.festival.split(' ').length-1]}</span><div class="info-label">Festival</div><div class="info-value">${s.festival.split(' ').slice(0,-1).join(' ')}</div></div>
  `;

  // Story
  document.getElementById('mStory').textContent = s.story;

  // Fun fact
  document.getElementById('mFunFact').innerHTML = `
    <span class="fun-fact-icon">💡</span>
    <div class="fun-fact-text">${s.funFact}</div>
  `;

  // Quiz
  const shuffled = [...s.quiz.opts].sort(() => Math.random() - .5);
  document.getElementById('mQuiz').innerHTML = `
    <h4>🎯 Quick Quiz!</h4>
    <div style="font-size:.95rem;font-weight:700;color:#444;margin-bottom:12px;">${s.quiz.q}</div>
    ${shuffled.map(o => `<button class="qq-option" onclick="window.checkGkAns(this,'${o.replace(/'/g,"\\'")}','${s.quiz.ans.replace(/'/g,"\\'")}','${s.id}')">${o}</button>`).join('')}
    <div class="qq-fb" id="qqFb"></div>
  `;

  document.getElementById('overlay').classList.add('show');
}

window.checkGkAns = function(btn, chosen, correct, stateId) {
  if (quizAnswered) return;
  quizAnswered = true;
  const fb = document.getElementById('qqFb');
  document.querySelectorAll('.qq-option').forEach(b => b.disabled = true);

  if (chosen === correct) {
    btn.classList.add('correct');
    fb.textContent = '🎉 Correct! You earned a stamp!'; fb.className = 'qq-fb ok';
    confettiBurst(30);
    markCompleted(stateId);
    renderStates();
    renderStamps();
  } else {
    btn.classList.add('wrong');
    fb.innerHTML = `😅 Not quite! Answer: <strong>${correct}</strong>`; fb.className = 'qq-fb no';
    document.querySelectorAll('.qq-option').forEach(b => {
      if (b.textContent === correct) b.classList.add('correct');
    });
  }
};

function closeModal(e) { if (e.target.id === 'overlay') closeModalBtn(); }
window.closeModalBtn = () => document.getElementById('overlay').classList.remove('show');

// ── TAB SWITCH ──
window.switchTab = function(id, el) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  el.classList.add('active');
  if (id === 'stamps') renderStamps();
};

function confettiBurst(count = 30) {
  const cols = ['#FFD93D','#FF6B35','#9B5DE5','#00BBF9','#F15BB5','#00F5D4'];
  for (let i = 0; i < count; i++) {
    const c = document.createElement('div'); c.className = 'confetti-piece';
    c.style.cssText = `left:${20+Math.random()*60}vw;top:30vh;background:${cols[i%cols.length]};animation-delay:${Math.random()*.4}s;animation-duration:${.9+Math.random()*.5}s;`;
    document.body.appendChild(c); setTimeout(() => c.remove(), 1600);
  }
}

// ── INIT ──
renderStates();
renderStamps();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js').catch(()=>{});
</script>
</body>
</html>
