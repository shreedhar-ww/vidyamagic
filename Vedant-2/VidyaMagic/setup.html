<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Welcome — VidyaMagic</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Nunito',sans-serif;background:linear-gradient(135deg,#9B5DE5,#F15BB5,#FF6B35);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}

.card{background:#fff;border-radius:32px;padding:40px 32px;max-width:440px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:popIn .5s cubic-bezier(.34,1.56,.64,1);}
@keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}

.logo{font-size:1.2rem;font-weight:900;background:linear-gradient(135deg,#9B5DE5,#F15BB5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;}
.mascot{font-size:80px;display:block;margin-bottom:8px;animation:bob 2s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

h2{font-size:1.7rem;font-weight:900;color:#333;margin-bottom:6px;}
.sub{font-size:.95rem;color:#aaa;font-weight:700;margin-bottom:28px;}

/* Step indicator */
.steps{display:flex;gap:8px;justify-content:center;margin-bottom:28px;}
.step-dot{width:10px;height:10px;border-radius:50%;background:#eee;transition:background .3s;}
.step-dot.active{background:linear-gradient(135deg,#9B5DE5,#F15BB5);}
.step-dot.done{background:#00b894;}

/* Name input */
.name-input{
  width:100%;padding:16px;text-align:center;font-size:1.5rem;font-weight:900;
  font-family:'Nunito',sans-serif;border:3px solid #e8e0f5;border-radius:18px;
  outline:none;transition:border-color .2s;margin-bottom:8px;
}
.name-input:focus{border-color:#9B5DE5;}
.name-hint{font-size:.8rem;color:#aaa;font-weight:700;margin-bottom:20px;}

/* Avatar grid */
.avatar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}
.avatar-opt{
  font-size:2.2rem;padding:14px;border-radius:18px;cursor:pointer;
  border:3px solid #eee;background:#fafafa;
  transition:all .2s;
}
.avatar-opt:hover{transform:scale(1.1);}
.avatar-opt.selected{border-color:#9B5DE5;background:#f5f0ff;transform:scale(1.12);box-shadow:0 4px 14px rgba(155,93,229,.3);}

/* Age selector */
.age-grid{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:20px;}
.age-btn{
  padding:10px 18px;border:2.5px solid #eee;border-radius:14px;
  font-size:.95rem;font-weight:900;cursor:pointer;background:#fff;
  font-family:'Nunito',sans-serif;transition:all .2s;color:#555;
}
.age-btn:hover{border-color:#9B5DE5;}
.age-btn.selected{background:linear-gradient(135deg,#9B5DE5,#F15BB5);color:#fff;border-color:transparent;}

/* Theme picker */
.theme-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px;}
.theme-opt{
  border-radius:18px;padding:16px 8px;text-align:center;cursor:pointer;
  border:3px solid transparent;transition:all .2s;color:#fff;
  box-shadow:0 4px 0 rgba(0,0,0,.12);
}
.theme-opt:hover{transform:translateY(-4px);}
.theme-opt.selected{border-color:#FFD93D;transform:translateY(-4px);box-shadow:0 8px 0 rgba(0,0,0,.1);}
.theme-opt.t-jungle{background:linear-gradient(135deg,#2C7A3F,#6FB76A);}
.theme-opt.t-space{background:linear-gradient(135deg,#1A237E,#3D5AFE);}
.theme-opt.t-magic{background:linear-gradient(135deg,#9B5DE5,#F15BB5);}
.theme-emoji{font-size:2rem;display:block;margin-bottom:4px;}
.theme-name{font-size:.75rem;font-weight:900;}

/* Buttons */
.btn-primary{
  width:100%;padding:16px;background:linear-gradient(135deg,#9B5DE5,#F15BB5);
  border:none;border-radius:18px;color:#fff;font-size:1.1rem;font-weight:900;
  cursor:pointer;font-family:'Nunito',sans-serif;
  box-shadow:0 5px 0 rgba(155,93,229,.4);transition:transform .15s;
}
.btn-primary:hover{transform:translateY(-2px);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;}

.welcome-back{
  background:linear-gradient(135deg,#f5f0ff,#fff0f8);
  border-radius:18px;padding:16px;margin-bottom:20px;
}
.welcome-back .name{font-size:1.4rem;font-weight:900;color:#333;}
.welcome-back .meta{font-size:.85rem;color:#aaa;font-weight:700;margin-top:4px;}
.change-link{color:#9B5DE5;font-size:.82rem;font-weight:900;cursor:pointer;text-decoration:underline;margin-top:8px;display:block;}
</style>
</head>
<body>
<div class="card" id="card">
  <!-- content injected by JS -->
</div>

<script>
const AVATARS = ['🦁','🐯','🦊','🐧','🦋','🦕','🐬','🦄'];
const THEMES  = [
  { id:'jungle', label:'Jungle', emoji:'🌴', cls:'t-jungle' },
  { id:'space',  label:'Space',  emoji:'🚀', cls:'t-space'  },
  { id:'magic',  label:'Magic',  emoji:'🏰', cls:'t-magic'  },
];

let selectedAvatar = '🦁';
let selectedAge    = 7;
let selectedTheme  = 'space';
let kidName        = '';
let step           = 1; // 1=name+avatar, 2=theme

// Check if profile already exists
const existing = JSON.parse(localStorage.getItem('vm_kid') || 'null');

function getCard() { return document.getElementById('card'); }

function renderStepDots(current) {
  return `<div class="steps">
    <div class="step-dot ${current>1?'done':'active'}"></div>
    <div class="step-dot ${current===2?'active':current>2?'done':''}"></div>
  </div>`;
}

function renderWelcomeBack() {
  getCard().innerHTML = `
    <div class="logo">✨ VidyaMagic</div>
    <span class="mascot">${existing.avatar}</span>
    <h2>Welcome back!</h2>
    <div class="welcome-back">
      <div class="name">${existing.name} ${existing.avatar}</div>
      <div class="meta">Age ${existing.age} · ${existing.theme.charAt(0).toUpperCase()+existing.theme.slice(1)} theme · ⭐ ${existing.stars || 0} stars</div>
    </div>
    <button class="btn-primary" onclick="goToMap()">▶ Continue Adventure</button>
    <span class="change-link" onclick="renderStep1()">Change profile</span>`;
}

function renderStep1() {
  step = 1;
  getCard().innerHTML = `
    <div class="logo">✨ VidyaMagic</div>
    ${renderStepDots(1)}
    <span class="mascot">👋</span>
    <h2>What's your name?</h2>
    <p class="sub">Let's set up your adventure!</p>
    <input class="name-input" id="nameInput" type="text" placeholder="e.g. Vedant" maxlength="20"
      oninput="kidName=this.value.trim();" onkeydown="if(event.key==='Enter')nextStep()"/>
    <div class="name-hint">Type your first name</div>
    <div style="font-size:.9rem;font-weight:900;color:#555;margin-bottom:10px;text-align:left;">Choose your avatar:</div>
    <div class="avatar-grid" id="avatarGrid"></div>
    <div style="font-size:.9rem;font-weight:900;color:#555;margin-bottom:10px;text-align:left;">Your age:</div>
    <div class="age-grid" id="ageGrid"></div>
    <button class="btn-primary" id="nextBtn" onclick="nextStep()">Next →</button>`;

  // Render avatars
  document.getElementById('avatarGrid').innerHTML = AVATARS.map(a =>
    `<div class="avatar-opt${a===selectedAvatar?' selected':''}" onclick="selectAvatar('${a}')">${a}</div>`
  ).join('');

  // Render ages
  document.getElementById('ageGrid').innerHTML = [4,5,6,7,8].map(age =>
    `<button class="age-btn${age===selectedAge?' selected':''}" onclick="selectAge(${age})">${age} yrs</button>`
  ).join('');

  if (existing && !kidName) {
    document.getElementById('nameInput').value = existing.name;
    kidName = existing.name;
  }
}

function renderStep2() {
  step = 2;
  getCard().innerHTML = `
    <div class="logo">✨ VidyaMagic</div>
    ${renderStepDots(2)}
    <span class="mascot">🎨</span>
    <h2>Pick your world!</h2>
    <p class="sub">Every world has the same lessons — just different adventures.</p>
    <div class="theme-grid">${THEMES.map(t => `
      <div class="theme-opt ${t.cls}${t.id===selectedTheme?' selected':''}" onclick="selectTheme('${t.id}')">
        <span class="theme-emoji">${t.emoji}</span>
        <div class="theme-name">${t.label}</div>
      </div>`).join('')}
    </div>
    <button class="btn-primary" onclick="saveAndGo()">🚀 Start Adventure!</button>`;
}

function selectAvatar(a) {
  selectedAvatar = a;
  document.querySelectorAll('.avatar-opt').forEach(el => el.classList.toggle('selected', el.textContent === a));
}

function selectAge(a) {
  selectedAge = a;
  document.querySelectorAll('.age-btn').forEach(el => el.classList.toggle('selected', +el.textContent.replace(' yrs','') === a));
}

function selectTheme(t) {
  selectedTheme = t;
  document.querySelectorAll('.theme-opt').forEach(el => el.classList.toggle('selected', el.onclick.toString().includes(`'${t}'`)));
  renderStep2(); // re-render to update selected state
}

function nextStep() {
  if (!kidName) {
    const input = document.getElementById('nameInput');
    if (input) { input.style.borderColor='#FF6B35'; input.focus(); }
    return;
  }
  renderStep2();
}

function saveAndGo() {
  // Save kid profile to localStorage
  const kid = { name: kidName, avatar: selectedAvatar, age: selectedAge, theme: selectedTheme, stars: 0, kidId: null, createdAt: Date.now() };
  localStorage.setItem('vm_kid', JSON.stringify(kid));

  // Set theme
  localStorage.setItem('vm_theme', selectedTheme);

  // Create kid in backend (best effort)
  fetch('http://localhost:3001/api/kids', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ name: kidName, age: selectedAge, grade: Math.max(1, selectedAge - 5), theme: selectedTheme })
  }).then(r => r.json()).then(data => {
    if (data.kid?.id) {
      kid.kidId = data.kid.id;
      localStorage.setItem('vm_kid', JSON.stringify(kid));
      // Also save to vm_progress
      const prog = JSON.parse(localStorage.getItem('vm_progress') || '{}');
      prog.kidId = data.kid.id; prog.kidName = kidName;
      localStorage.setItem('vm_progress', JSON.stringify(prog));
    }
  }).catch(()=>{}).finally(() => goToMap());
}

function goToMap() { window.location.href = 'prototype.html'; }

// Boot
if (existing) renderWelcomeBack();
else renderStep1();
</script>
</body>
</html>
